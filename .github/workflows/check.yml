# Builds every draft (pull request) before it can be published.
# Sveltia CMS saves each draft as a pull request; with branch protection on main requiring the "check" job,
# a draft with invalid content (e.g. a "from" price without amount) cannot be merged, so the live site never breaks.
# Same build as the deploy (schema validation, translations report, internal links), without publishing.
name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        env:
          SITE_URL: ${{ vars.SITE_URL || (github.repository == 'studiobelvi/studiobelvi.github.io' && 'https://www.studiobelvi.com' || '') }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          CMS_REPO: ${{ github.repository }}
          CMS_BRANCH: ${{ github.event.repository.default_branch }}
          CMS_AUTH_URL: ${{ vars.CMS_AUTH_URL }}
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
