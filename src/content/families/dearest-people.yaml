en:
  tagline: For the people who are part of your story.
  intro: We design collections of personalised gifts and details to involve the wedding party, thank family and special people, and create a connection between those who accompany you before and during the wedding.
  packs:
    - inclusion_groups:
        - items:
            - Creative concept and aesthetic direction of the collection.
            - 4 personalised proposal boxes for the wedding party.
            - 2 gifts for parents or other special guests.
            - 6 coordinated boutonnières/corsages for the wedding day.
            - Personalisation and fabrication of the elements included.
            - Preparation and packing.
        - title: Personalising the collection
          description: "The proposal boxes can be developed in two formats:"
          items:
            - "The Essentials Box: a careful selection of details with personalised presentation."
            - "The Signature Box: a more elaborate selection, with special packaging and exclusive pieces designed for the occasion."
  extras:
    - { label: Additional proposal boxes }
    - { label: Additional gifts for family and special guests }
    - { label: Additional boutonnières and corsages }
    - { label: Premium content and special packaging }
    - { label: Individual personalisation of each gift }
ca:
  tagline: Per a les persones que formen part de la vostra història.
  intro: Dissenyem col·leccions de regals i detalls personalitzats per implicar el seguici, agrair als familiars i a les persones especials, i crear una connexió entre els qui us acompanyen abans i durant el casament.
  packs:
    - inclusion_groups:
        - items:
            - Concepte creatiu i direcció estètica de la col·lecció.
            - 4 proposal boxes personalitzades per al seguici.
            - 2 regals per als pares o altres convidats especials.
            - 6 boutonnières/corsages coordinats per al dia del casament.
            - Personalització i fabricació dels elements inclosos.
            - Preparació i embalatge.
        - title: Personalització de la col·lecció
          description: "Les proposal boxes es poden desenvolupar en dos formats:"
          items:
            - "The Essentials Box: una selecció acurada de detalls amb presentació personalitzada."
            - "The Signature Box: una selecció més elaborada, amb packaging especial i peces exclusives dissenyades per a l'ocasió."
  extras:
    - { label: Proposal boxes addicionals }
    - { label: Regals addicionals per a familiars i convidats especials }
    - { label: Boutonnières i corsages addicionals }
    - { label: Contingut prèmium i packaging especial }
    - { label: Personalització individual de cada regal }
