en:
  tagline: A family of signage that turns the wedding's identity into physical elements.
  intro: From welcome and wayfinding pieces to artistic and sculptural compositions, every element is designed to fit the aesthetic and the experience of the celebration.
  common_inclusions:
    - Custom design adapted to the wedding's visual identity.
    - Fabrication of the elements included.
    - Preparation and packing.
    - One round of content revisions and two rounds of design revisions.
  packs:
    - description: A functional, personalised signage collection that welcomes the guests and helps them find their place at the celebration.
      inclusion_groups:
        - items:
            - Welcome sign of up to 50 × 70 cm.
            - Physical seating plan for up to 80 guests and 8 tables.
            - Coordinated design of both pieces.
            - Fabrication with standard materials and finishes.
            - Preparation and packing.
    - description: A signage proposal conceived as an artistic or sculptural installation, where the information becomes part of a visual and spatial composition.
      inclusion_groups:
        - items:
            - Concept for a signage installation.
            - Welcome sign integrated into the composition.
            - Physical seating plan for up to 80 guests and 8 tables.
            - Composition of up to 3 leading graphic or three-dimensional elements.
            - Combination of standard artistic materials and finishes.
            - Fabrication, preparation and packing.
  extras:
    - { label: Table numbers }
    - { label: Additional signage }
    - { label: Three or more additional simple signs within the same collection }
    - { label: Illustrated seating plan }
    - { label: Sculptural elements }
    - { label: Built-in NFC for a simple experience }
    - { label: Lighting }
    - { label: Suspended or large-format compositions, price: { note: on request } }
ca:
  tagline: Una família de senyalística que transforma la identitat del casament en elements físics.
  intro: Des de peces de benvinguda i orientació fins a composicions artístiques i escultòriques, cada element es dissenya per integrar-se en l'estètica i l'experiència de la celebració.
  common_inclusions:
    - Disseny personalitzat i adaptació a la identitat visual del casament.
    - Fabricació dels elements previstos.
    - Preparació i embalatge.
    - Una ronda de correccions de contingut i dues rondes de correccions de disseny.
  packs:
    - description: Una col·lecció de senyalística funcional i personalitzada que dona la benvinguda als convidats i els ajuda a trobar el seu lloc a la celebració.
      inclusion_groups:
        - items:
            - Cartell de benvinguda de fins a 50 × 70 cm.
            - Seating plan físic per a fins a 80 convidats i 8 taules.
            - Disseny coordinat de les dues peces.
            - Fabricació amb materials i acabats estàndard.
            - Preparació i embalatge.
    - description: Una proposta de senyalística concebuda com una instal·lació artística o escultòrica, on la informació s'integra en una composició visual i espacial.
      inclusion_groups:
        - items:
            - Conceptualització d'una instal·lació de senyalística.
            - Cartell de benvinguda integrat en la composició.
            - Seating plan físic per a fins a 80 convidats i 8 taules.
            - Composició de fins a 3 elements gràfics o tridimensionals protagonistes.
            - Combinació de materials i acabats artístics estàndard.
            - Fabricació, preparació i embalatge.
  extras:
    - { label: Números de taula }
    - { label: Senyalística addicional }
    - { label: Tres o més peces addicionals de senyalística senzilla dins d'una mateixa col·lecció }
    - { label: Seating plan il·lustrat }
    - { label: Elements escultòrics }
    - { label: NFC integrat per a una experiència senzilla }
    - { label: Il·luminació }
    - { label: Composicions suspeses o de gran format, price: { note: específic } }
