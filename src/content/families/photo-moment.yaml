  name: The Photo Moment
  cover_image: /assets/images/scenography/sceno5.webp
  tagline: Una instalación o rincón especialmente concebido para convertirse en un recuerdo visual de la boda.
  intro: Diseñamos espacios y composiciones que combinan elementos gráficos, escultóricos y escenográficos para crear un punto de encuentro, descubrimiento y fotografía.
