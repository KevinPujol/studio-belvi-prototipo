      price: { kind: from, amount: 500, vat_mode: excluded }
      inclusion_groups:
        - items:
            - Un fondo, panel o estructura sencilla personalizada.
            - Dimensiones de hasta 2 × 2 m como referencia máxima, según materiales y complejidad.
