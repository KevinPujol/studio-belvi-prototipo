en:
  tagline: A stationery identity designed around the couple's story and aesthetic.
  intro: Each collection is developed as a visual language of its own, from the first invitations to the small details that accompany the celebration.
  common_inclusions:
    - Concept and design of the collection.
    - Adaptation to the wedding's visual identity.
    - Production of the pieces included.
    - Two rounds of design revisions.
    - Preparation and packaging.
  notes:
    - Prices based on a wedding of up to 80 guests, with standard quantities, formats and finishes.
  packs:
    - description: An invitation collection designed to announce the wedding and share the first details with the guests.
      inclusion_groups:
        - items:
            - One main invitation.
            - One additional information card.
            - One standard envelope per invitation.
            - Up to 80 units.
            - Standard production and assembly.
    - description: A stationery collection that accompanies the celebration and carries on the wedding's visual identity.
      inclusion_groups:
        - items:
            - Individual menus.
            - Personalised place cards.
            - Table numbers.
            - Up to 80 menus.
            - Up to 80 place cards.
            - Up to 8 table numbers.
            - Standard production, assembly and packaging.
    - description: "The complete collection: from the first announcements to the stationery details on the wedding day."
      inclusion_groups:
        - items:
            - Static digital save the date.
            - Everything included in The Invitation.
            - Everything included in The Day-of.
            - Standard production, assembly and packaging.
    - description: A complete collection elevated with original graphic resources, special finishes and an exclusive piece designed for the couple.
      inclusion_groups:
        - items:
            - Everything included in The Full Suite.
            - One original illustration or graphic resource.
            - One main special finish, such as foil, die-cutting or a custom wax seal.
            - One additional exclusive stationery piece.
            - Production of up to 80 units of each piece where applicable.
  extras:
    - { label: Original illustration of the venue }
    - { label: Special die-cut }
    - { label: Custom wax seal }
    - { label: Foil, price: { note: depending on print run and pieces } }
    - { label: Personalised envelopes }
    - { label: Additional stationery, price: { note: depending on pieces and units } }
    - { label: Interactive invitation }
    - { label: Puzzle invitation or invitation in pieces }
    - { label: Calligraphy or individual personalisation, price: { note: depending on quantity } }
ca:
  tagline: Una identitat de papereria dissenyada al voltant de la història i l'estètica de la parella.
  intro: Cada col·lecció es desenvolupa com un llenguatge visual propi, des de les primeres invitacions fins als petits detalls que acompanyen la celebració.
  common_inclusions:
    - Conceptualització i disseny de la col·lecció.
    - Adaptació a la identitat visual del casament.
    - Producció de les peces previstes.
    - Dues rondes de correccions de disseny.
    - Preparació i empaquetatge.
  notes:
    - Preus orientats a un casament de fins a 80 convidats, amb quantitats, formats i acabats estàndard.
  packs:
    - description: Una col·lecció d'invitació dissenyada per presentar el casament i compartir els primers detalls amb els convidats.
      inclusion_groups:
        - items:
            - Una invitació principal.
            - Una targeta informativa complementària.
            - Un sobre estàndard per invitació.
            - Fins a 80 unitats.
            - Producció i muntatge estàndard.
    - description: Una col·lecció de papereria que acompanya la celebració i dona continuïtat a la identitat visual del casament.
      inclusion_groups:
        - items:
            - Menús individuals.
            - Marcadors de lloc personalitzats.
            - Numeració de taules.
            - Fins a 80 menús.
            - Fins a 80 marcadors de lloc.
            - Fins a 8 números de taula.
            - Producció, muntatge i empaquetatge estàndard.
    - description: "La col·lecció completa: des de les primeres comunicacions fins als detalls de papereria del dia del casament."
      inclusion_groups:
        - items:
            - Save the date digital estàtic.
            - Tot el que inclou The Invitation.
            - Tot el que inclou The Day-of.
            - Producció, muntatge i empaquetatge estàndard.
    - description: Una col·lecció completa elevada amb recursos gràfics originals, acabats especials i una peça exclusiva dissenyada per a la parella.
      inclusion_groups:
        - items:
            - Tot el que inclou The Full Suite.
            - Una il·lustració o recurs gràfic original.
            - Un acabat especial principal, com ara foil, troquel o lacre personalitzat.
            - Una peça addicional de papereria exclusiva.
            - Producció de fins a 80 unitats de cada peça quan correspongui.
  extras:
    - { label: Il·lustració original del venue }
    - { label: Troquel especial }
    - { label: Lacre personalitzat }
    - { label: Foil, price: { note: segons tiratge i peces } }
    - { label: Sobres personalitzats }
    - { label: Papereria addicional, price: { note: segons peces i unitats } }
    - { label: Invitació interactiva }
    - { label: Puzzle invitation o invitació amb peces }
    - { label: Cal·ligrafia o personalització individual, price: { note: segons la quantitat } }
