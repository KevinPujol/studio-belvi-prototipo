en:
  tagline: The little things that make you, you.
  intro: We design accessories, jewellery and special pieces to give personality to the couple's styling. From small handmade details to fully personalised sets, each creation is born from a story, an aesthetic and a way of celebrating who you are.
  notes:
    - We can also create coordinated pieces for family, witnesses and special people, as well as personalised boxes to present and keep the creations.
