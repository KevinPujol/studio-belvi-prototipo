# Textos generales del catálogo.
# Fuentes: Belvi Creative Direction.pdf (CD) p. 3 y 11; Belvi Production Packs.pdf (PP) p. 3, 42 y 43.
es:
  cd_title: Dirección creativa
  cd_intro: Desarrollamos el universo creativo de la boda. Conceptualizamos, diseñamos y creamos una guía que podéis utilizar con todos vuestros proveedores.
  cd_levels_intro: Tres niveles de profundidad.
  expand_title: Expand your story
  expand_intro: Creative Direction Support para acompañar a los proveedores durante el proceso.
  expand_price_header: Precio orientativo
  expand:
    - { label: Sesión adicional de 60 min, price: { kind: fixed, amount: 90, vat_mode: unspecified } }
    - { label: Revisión de propuestas de proveedores, price: { kind: from, amount: 150, vat_mode: unspecified } }
    - { label: Acompañamiento creativo mensual, price: { kind: from, amount: 250, vat_mode: unspecified, unit: month } }
    - { label: Supervisión creativa presencial, price: { kind: quote, vat_mode: unspecified } }
  pp_title: Production packs
  pp_intro: Objetos, espacios y experiencias únicos. Nuestros packs están para ayudarte a decidir en qué te quieres enfocar.
  extension_types_title: Ampliaciones aplicables a todos los packs
  extension_types:
    - { name: More, meaning: Más unidades o más mesas, example: "80 a 120 invitaciones; 6 a 10 centros" }
    - { name: Custom, meaning: Más personalización o desarrollo, example: "Ilustración original, figura 3D propia, retos personalizados" }
    - { name: Immersive, meaning: Añadir espacio o interacción, example: "Instalación, iluminación, NFC, búsqueda del tesoro" }
  conditions_title: Condiciones aplicables a todos los packs
  conditions:
    - Todos los precios del catálogo son precios desde y excluyen IVA.
    - Los precios incluyen una cantidad concreta de revisiones y un alcance definido.
    - Transporte, montaje, desmontaje y desplazamientos se especifican según el proyecto.
  home_note: Precios desde. Transporte y montaje según proyecto.
en:
  cd_title: Creative direction
  cd_intro: We develop the creative universe of your wedding. We conceive, design and create a guide you can use with all your suppliers.
  cd_levels_intro: Three levels of depth.
  expand_title: Expand your story
  expand_intro: Creative Direction Support to accompany your suppliers throughout the process.
  expand_price_header: Indicative prices
  expand:
    - { label: Additional 60-minute session }
    - { label: Review of supplier proposals }
    - { label: Monthly creative support }
    - { label: On-site creative supervision }
  pp_title: Production packs
  pp_intro: Unique objects, spaces and experiences. Our packs are here to help you decide what you want to focus on.
  extension_types_title: Add-ons for every pack
  extension_types:
    - { meaning: More units or more tables, example: "80 to 120 invitations; 6 to 10 centrepieces" }
    - { meaning: More personalisation or development, example: "Original illustration, custom 3D figure, personalised challenges" }
    - { meaning: Add a space or an interaction, example: "Installation, lighting, NFC, treasure hunt" }
  conditions_title: Conditions for every pack
  conditions:
    - All catalogue prices are starting prices and exclude VAT.
    - Prices include a set number of revisions and a defined scope.
    - Transport, assembly, dismantling and travel are specified for each project.
  home_note: Starting prices. Transport and assembly depend on the project.
ca:
  cd_title: Direcció creativa
  cd_intro: Desenvolupem l'univers creatiu del casament. Conceptualitzem, dissenyem i creem una guia que podeu fer servir amb tots els vostres proveïdors.
  cd_levels_intro: Tres nivells de profunditat.
  expand_title: Expand your story
  expand_intro: Creative Direction Support per acompanyar els proveïdors durant el procés.
  expand_price_header: Preu orientatiu
  expand:
    - { label: Sessió addicional de 60 min }
    - { label: Revisió de propostes de proveïdors }
    - { label: Acompanyament creatiu mensual }
    - { label: Supervisió creativa presencial }
  pp_title: Production packs
  pp_intro: Objectes, espais i experiències únics. Els nostres packs són aquí per ajudar-te a decidir en què et vols centrar.
  extension_types_title: Ampliacions aplicables a tots els packs
  extension_types:
    - { meaning: Més unitats o més taules, example: "De 80 a 120 invitacions; de 6 a 10 centres" }
    - { meaning: Més personalització o desenvolupament, example: "Il·lustració original, figura 3D pròpia, reptes personalitzats" }
    - { meaning: Afegir un espai o una interacció, example: "Instal·lació, il·luminació, NFC, cerca del tresor" }
  conditions_title: Condicions aplicables a tots els packs
  conditions:
    - Tots els preus del catàleg són preus des de i no inclouen l'IVA.
    - Els preus inclouen una quantitat concreta de revisions i un abast definit.
    - El transport, el muntatge, el desmuntatge i els desplaçaments s'especifiquen segons el projecte.
  home_note: Preus des de. Transport i muntatge segons el projecte.
