en:
  motto: A spark that sets the story in motion.
  description: An initial creative direction for couples who have an idea of what they want but need to give it shape, coherence and personality.
  ideal_for: Couples who have a wedding planner or their own suppliers and want an aesthetic direction to use as a starting point.
  price_label: Starting investment
  includes:
    - An initial meeting of up to 45 minutes.
    - Discovery questionnaire.
    - Development of a creative concept.
    - Visual moodboard.
    - Colour palette and choice of typefaces.
    - Direction for materials, textures and finishes.
    - Application references for stationery, decoration and atmosphere.
    - Digital style guide of about 6 pages.
    - Presentation meeting for the guide.
