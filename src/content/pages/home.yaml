es:
  hero_small: TU HISTORIA. TU BODA. TU ESTUDIO CREATIVO.
  hero_title: Nos encargamos de los aspectos creativos de tu boda
  hero_text: En <b>Studio Belvi</b> somos especialistas en narrativa visual. Nuestro <i>leitmotiv</i> son las historias personales y queremos ayudarte a que cuentes la tuya en un solo día, posiblemente el día más importante de tu vida.
  hero_cta: Empieza tu aventura
  portfolio_span: VUESTRAS HISTORIAS
  portfolio_title: Cada una de vuestras historias alimenta el alma de Studio Belvi.
  portfolio_text: Aquí te dejamos un porfolio que crece con nosotros. Cada celebración nos hace mejores narradores y nos acerca más a ti, a tu historia y a tu visión del mundo.
  portfolio_card01_front: Érase una vez…
  portfolio_card01_back_title: Érase una vez…
  portfolio_card01_back_text: Una pareja enamorada de los libros y la fantasía, y una boda que era como adentrarse en un cuento de hadas.
  portfolio_card01_back_btn: Explora el proyecto
  services_span: QUÉ HACEMOS
  services_title: Tu personalidad como protagonista.
  services_text: Damos siempre máxima importancia al <b>carácter</b>, la <b>originalidad</b>, la <b>belleza</b> y la <b>emoción</b>.<br>Para convertir tu historia en algo tangible, cubrimos tres áreas imprescindibles de la narrativa…
  services_card01_title: memorabilia
  services_card01_text: Son todos esos elementos que sirven como recuerdo de una buena historia. Ofrecemos a tus invitados, así como a ti y a tu pareja, toda clase de detalles y elementos simbólicos que reflejan tu personalidad y tu trayecto de vida. ¿Quieres ver algunos ejemplos?
  services_card02_title: escenografía
  services_card02_text: Es la ideación y fabricación de todo aquello que unifica los espacios en una sola temática y bajo una misma estética. El ambiente narrativo es el elemento que refleja tu verdadera esencia. ¿Cómo te imaginas la ceremonia? ¿Qué dice sobre ti la decoración de las mesas, el arco ceremonial, el altar o el <i>photocall</i>?
  services_card03_title: inmersión
  services_card03_text: Esta última área convierte a tus invitados en personajes irremplazables de tu historia. Mediante elementos interactivos que alimenten los cinco sentidos (juegos, exposiciones, sorteos, bingos musicales, búsquedas de tesoros…), os sumergiréis todos en la narración de la que eres protagonista.
  collab_span: CÓMO PODEMOS COLABORAR
  collab_title: Luce tu historia
  collab_text: Ya sea con intervenciones pequeñas o con la celebración al completo, nos encantaría dar voz a tu historia.
  collab_card01_title: Story Sparks
  collab_card01_text: Esta opción es para parejas que quieran añadir destellos pequeños pero representativos a una celebración ya diseñada.
  collab_card02_title: Story Chapters
  collab_card02_text: Si tu celebración ya está casi planeada pero quieres añadirle una capa narrativa e interactiva, esta opción es para ti.
  collab_card03_title: Story Universe
  collab_card03_text: En tu boda ideal hay todo un universo alrededor de tu historia. Con esta opción diseñamos desde cero cada objeto, espacio e interacción para que todo lo que envuelve tu boda esté impregnado de tu esencia.
  process_span: NUESTRO PROCESO
  process_title: Narramos con intención
  process_card01_title: descubrimiento
  process_card01_text: Nos cuentas tu historia, tus gustos, tus recuerdos, lo que te emociona y lo que te enamora.
  process_card02_title: concepto
  process_card02_text: "Ideamos el concepto narrativo y las tres áreas que componen tu historia: memorabilia, escenografía e inmersión."
  process_card03_title: creación
  process_card03_text: Ponemos en práctica las ideas mediante diseño, fabricación y artesanía. Hacemos tangible lo intangible.
  process_card04_title: experiencia
  process_card04_text: Tus invitados y tú os sumergís en una historia llena de emoción y significado.
  contact_title: Inventemos juntos una fiesta inolvidable
  contact_text: Studio Belvi es el narrador, diseñador y artesano que tu evento merece.
  contact_cta: ¿Empezamos?
en:
  hero_small: YOUR STORY. YOUR WEDDING. YOUR CREATIVE STUDIO.
  hero_title: We manage the creative aspects of your wedding
  hero_text: At <b>Studio Belvi</b>, we specialize in visual storytelling. Personal stories are our guiding principle, and we want to help you tell yours in a single day—maybe the most important day of your life.
  hero_cta: Start your story
  portfolio_span: YOUR STORIES
  portfolio_title: Each of your stories nourishes the soul of Studio Belvi.
  portfolio_text: Here’s a portfolio that grows with us. Every celebration makes us better storytellers and brings us closer to you, your story, and your view of the world.
  portfolio_card01_front: Once upon a story…
  portfolio_card01_back_title: Once upon a story…
  portfolio_card01_back_text: A couple in love with books and fantasy, and a wedding that felt like stepping into a fairy tale.
  portfolio_card01_back_btn: Explore project
  services_span: WHAT WE DO
  services_title: Your personality as a main character
  services_text: We always place the utmost importance on <b>character</b>, <b>originality</b>, <b>beauty</b>, and <b>emotion</b>.<br>To bring your story to life, we cover three essential areas of storytelling…
  services_card01_title: memorabilia
  services_card01_text: These are all the elements that serve as mementos of a beautiful story. We offer your guests—as well as you and your partner—all kinds of thoughtful touches and symbolic items that reflect your personality and your life journey. Would you like to see some examples?
  services_card02_title: scenography
  services_card02_text: It involves the design and creation of everything that unifies the spaces under a single theme and a consistent aesthetic. The narrative atmosphere is what reflects your true essence. How do you envision the ceremony? What do the table decorations, the ceremonial arch, the altar, or the photo booth say about you?
  services_card03_title: immersion
  services_card03_text: This final area turns your guests into irreplaceable characters in your story. Through interactive elements that engage all five senses (games, exhibits, raffles, musical bingo, treasure hunts…), you’ll all be immersed in the narrative in which you play the leading role.
  collab_span: HOW WE CAN COLLABORATE
  collab_title: Show off your story
  collab_text: Whether it’s a small gathering or a full-scale celebration, we’d love to help tell your story.
  collab_card01_title: Story Sparks
  collab_card01_text: This option is for couples who want to add small but meaningful sparks to a celebration they’ve already planned.
  collab_card02_title: Story Chapters
  collab_card02_text: If your celebration is almost all planned out but you want to add a narrative and interactive element, this option is for you.
  collab_card03_title: Story Universe
  collab_card03_text: At your ideal wedding, there’s a whole world centered around your story. With this option, we design every object, space, and interaction from scratch so that everything surrounding your wedding is imbued with your essence.
  process_span: Our Process
  process_title: We tell stories with purpose
  process_card01_title: discovery
  process_card01_text: Tell us your story, your tastes, your memories, what moves you, and what you love.
  process_card02_title: concept
  process_card02_text: "We develop the narrative concept and the three elements that make up your story: memorabilia, scenography, and immersion."
  process_card03_title: creation
  process_card03_text: We bring ideas to life through design, manufacturing, and craftsmanship. We make the intangible tangible.
  process_card04_title: experience
  process_card04_text: You and your guests will be immersed in a story full of emotion and meaning.
  contact_title: Let’s create something unforgettable
  contact_text: Studio Belvi is the storyteller, designer, and artisan your event deserves.
  contact_cta: Shall we get started?
ca:
  hero_small: LA TEVA HISTÒRIA. EL TEU CASAMENT. EL TEU ESTUDI CREATIU.
  hero_title: Ens encarreguem dels aspectes creatius del teu casament
  hero_text: A <b>Studio Belvi</b> som especialistes en narrativa visual. El nostre <i>leitmotiv</i> són les històries personals i volem ajudar-te a que contis la teva en un sol dia, possiblement el dia més important de la teva vida.
  hero_cta: Comença la teva història
  hero_secondary_cta: Explora el Nostre Treball
  portfolio_span: LES VOSTRES HISTÒRIES
  portfolio_title: Cadascuna de les vostres històries alimenta l’ànima de Studio Belvi.
  portfolio_text: Aquí et deixem un portfolio que creix amb nosaltres. Cada celebració ens fa millors narradors i ens acosta més a tu, a la teva història i a la teva visió del món.
  portfolio_card01_front: Hi havia una vegada…
  portfolio_card01_back_title: Hi havia una vegada…
  portfolio_card01_back_text: Una parella enamorada dels llibres i la fantasia, i unes noces que eren com endinsar-se en un conte de fades.
  portfolio_card01_back_btn: Explora el projecte
  services_span: QUÈ FEM
  services_title: La teva personalitat com a protagonista.
  services_text: Donem sempre màxima importància al <b>caràcter</b>, l’<b>originalitat</b>, la <b>bellesa</b> i l’<b>emoció</b>.<br>Per a convertir la teva història en una cosa tangible, cobrim tres àrees imprescindibles de la narrativa…
  services_card01_title: memorabilia
  services_card01_text: Són tots aquells elements que serveixen com a record d’una bona història. Oferim als teus convidats, així com a tu i a la teva parella, tota classe de detalls i elements simbòlics que reflecteixen la teva personalitat i el teu trajecte de vida. Vols veure alguns exemples?
  services_card02_title: escenografia
  services_card02_text: És la ideació i fabricació de tot allò que unifica els espais en una sola temàtica i sota una mateixa estètica. L’ambient narratiu és l’element que reflecteix la teva veritable essència. Com t’imagines la cerimònia? Què diu de tu la decoració de les taules, l’arc cerimonial, l’altar o el <i>photocall</i>?
  services_card03_title: immersió
  services_card03_text: Aquesta última àrea converteix els teus convidats en personatges irreemplaçables de la teva història. Mitjançant elements interactius que alimentin els cinc sentits (jocs, exposicions, sortejos, bingos musicals, cerques de tresors…), us submergireu tots en la narració de la qual ets protagonista.
  collab_span: COM PODEM COLABORAR
  collab_title: Llueix la teva història
  collab_text: Ja sigui amb intervencions petites o amb la celebració al complet, ens encantaria donar veu a la teva història.
  collab_card01_title: Story Sparks
  collab_card01_text: Aquesta opció és per a parelles que vulguin afegir fulgors petits però representatius a una celebració ja dissenyada.
  collab_card02_title: Story Chapters
  collab_card02_text: Si la teva celebració ja està gairebé planejada però vols afegir-li una capa narrativa i interactiva, aquesta opció és per a tu.
  collab_card03_title: Story Universe
  collab_card03_text: En el teu casament ideal hi ha tot un univers al voltant de la teva història. Amb aquesta opció dissenyem des de zero cada objecte, espai i interacció perquè tot el que envolta el teu casament estigui impregnat de la teva essència.
  process_span: EL NOSTRE PROCÉS
  process_title: Narrem amb intenció
  process_card01_title: descobriment
  process_card01_text: Ens expliques la teva història, els teus gustos, els teus records, el que t’emociona i el que t’enamora.
  process_card02_title: concepte
  process_card02_text: "Ideem el concepte narratiu i les tres àrees que componen la teva història: memorabilia, escenografia i immersió."
  process_card03_title: creació
  process_card03_text: Posem en pràctica les idees mitjançant disseny, fabricació i artesania. Fem tangible l’intangible.
  process_card04_title: experiència
  process_card04_text: Els teus convidats i tu us submergiu en una història plena d’emoció i significat.
  contact_title: Inventem junts una festa inoblidable
  contact_text: Studio Belvi és el narrador, dissenyador i artesà que el teu esdeveniment mereix.
  contact_cta: Comencem?
